#cloud-config
# Kit de démarrage — VM as Code (Traefik + Task + scan de vulnérabilité)
# Portée volontairement minimale : ce fichier prépare l'hôte, pas l'application.
# L'application (docker-compose.yml, Taskfile.yml, futurs services) vit dans /opt/stack,
# à copier ou cloner séparément — voir tutoriels/01-cloud-init-et-vm.md.

hostname: starter-kit-vm

ssh_pwauth: false

users:
  - name: admin
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... remplacez-moi-par-votre-cle-publique

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw

write_files:
  - path: /opt/stack/README.txt
    permissions: '0644'
    content: |
      Ce dossier accueille votre docker-compose.yml et votre Taskfile.yml.
      Copiez-y (git clone ou scp) le contenu fourni dans compose/ et Taskfile.yml du kit de démarrage,
      puis lancez « task up » depuis ce dossier.

runcmd:
  # Docker Engine — dépôt officiel Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Task — dépôt officiel go-task (Cloudsmith)
  - curl -1sLf 'https://dl.cloudsmith.io/public/task/task/setup.deb.sh' | bash
  - apt-get install -y task

  # Pare-feu hôte minimal (durcissement de l'hôte)
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw --force enable

  # Préparation du répertoire de travail
  - mkdir -p /opt/stack
  - chown admin:admin /opt/stack

final_message: "VM prête : Docker, Docker Compose, Task et le pare-feu (ufw) sont installés. Copiez votre stack dans /opt/stack puis lancez 'task up'."
