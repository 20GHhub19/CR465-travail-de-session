#cloud-config
# Kit de démarrage — sandboxing des conteneurs avec gVisor (runsc)
# Variante de starter-kit/ (Docker rootful) : ajoute un runtime OCI en espace utilisateur (Sentry)
# qui intercepte les appels système entre les conteneurs applicatifs et le noyau hôte.
# Voir tutoriels/02-gvisor-vs-runc.md pour la portée et les compromis.

hostname: starter-kit-gvisor-vm

ssh_pwauth: false

users:
  - name: admin
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... remplacez-moi-par-votre-cle-publique

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - apt-transport-https
  - ufw

write_files:
  - path: /opt/stack/README.txt
    permissions: '0644'
    content: |
      Ce dossier accueille votre docker-compose.yml et votre Taskfile.yml (variante gVisor).
      Copiez-y (git clone ou scp) le contenu fourni dans compose/ et Taskfile.yml,
      puis lancez « task up » depuis ce dossier.

runcmd:
  # Docker Engine — dépôt officiel Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Task — dépôt officiel go-task (Cloudsmith)
  - curl -1sLf 'https://dl.cloudsmith.io/public/task/task/setup.deb.sh' | bash
  - apt-get install -y task

  # gVisor (runsc) — dépôt officiel gVisor, requiert Linux 5.6+ (x86_64/ARM64)
  - curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" > /etc/apt/sources.list.d/gvisor.list
  - apt-get update
  - apt-get install -y runsc
  - runsc install
  - systemctl restart docker

  # Pare-feu hôte minimal (durcissement de l'hôte)
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw --force enable

  # Préparation du répertoire de travail
  - mkdir -p /opt/stack
  - chown admin:admin /opt/stack

final_message: "VM prête : Docker, Docker Compose, Task, le runtime gVisor (runsc) et le pare-feu (ufw) sont installés. Copiez votre stack dans /opt/stack puis lancez 'task up'."
