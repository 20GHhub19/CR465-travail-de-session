# ============================================================
# Stack CR465 - Phase 3 durcie : reseaux + Traefik + socket-proxy + test
# Segmentation : edge (expose) / app (internal) / data (internal) / socket (internal)
# Durcissement : images epinglees, cap_drop ALL, no-new-privileges,
#                read_only, limites CPU/RAM, healthcheck, logs bornes
# ============================================================

# --- Options de securite communes a tous les services ---------
x-durcissement: &durcissement
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  edge:            # seul reseau relie a l'exterieur (ports 80/443 publies)
    name: cr465_edge
  app:             # communication applicative (Traefik <-> services)
    name: cr465_app
    internal: true # aucun acces Internet : les services ne peuvent pas sortir
  data:
    name: cr465_data
    internal: true # reserve aux bases de donnees (phase 4+)
  socket:
    name: cr465_socket
    internal: true # Traefik <-> socket-proxy uniquement
  egress:
    name: cr465_egress
    # Sortie Internet CONTROLEE : seuls les services qui en ont besoin y sont
    # rattaches (Moodle pour ses dependances, n8n pour ses webhooks sortants).
    # Exception documentee dans docs/security/02-durcissement-execution.md.

services:
  # ------------------------------------------------------------------
  # socket-proxy : expose l'API Docker en LECTURE SEULE a Traefik.
  # Evite de monter /var/run/docker.sock en direct : le mode :ro sur un
  # socket Unix n'empeche PAS les ecritures via l'API HTTP.
  # ------------------------------------------------------------------
  socket-proxy:
    <<: *durcissement
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: cr465-socket-proxy
    read_only: true
    tmpfs:
      - /tmp          # l'entrypoint ecrit /tmp/haproxy.cfg
      - /run          # haproxy ecrit son pidfile /run/haproxy.pid
    environment:
      CONTAINERS: 1   # lecture des conteneurs (necessaire a Traefik)
      SERVICES: 1
      NETWORKS: 1
      EVENTS: 1
      VERSION: 1      # Traefik negocie la version de l'API via /version
      INFO: 1
      PING: 1
      POST: 0         # AUCUNE ecriture : creation/modification impossible
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ------------------------------------------------------------------
  # Traefik : unique point d'entree HTTP/HTTPS
  # ------------------------------------------------------------------
  traefik:
    <<: *durcissement
    image: traefik:v3.7.15          # version de correctif epinglee
    container_name: cr465-traefik
    user: "1000:1000"              # non-root (uid/gid de l'utilisateur admin)
    read_only: true
    tmpfs:
      - /tmp
    cap_add:
      - NET_BIND_SERVICE           # seule capacite conservee : ports < 1024
    environment:
      # Negociation explicite de l'API Docker : sinon le client demande 1.24,
      # refuse par les moteurs recents (minimum 1.40 depuis Docker 25+).
      DOCKER_API_VERSION: "1.44"
    command:
      # --- decouverte des conteneurs via le proxy filtre (pas le socket brut)
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      # --- points d'entree
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # --- redirection systematique HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # --- journalisation d'acces en JSON (exploitable plus tard par Loki)
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
      # --- endpoint de sante interne (non publie)
      - --ping=true
      # --- configuration dynamique (certificat par defaut)
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      edge: {}
      app:
        # Alias DNS internes : les conteneurs resolvent *.cr465.test vers Traefik,
        # ce qui permet a Moodle de joindre Keycloak en HTTPS sans DNS externe.
        aliases:
          - auth.cr465.test
          - lms.cr465.test
          - shop.cr465.test
          - flow.cr465.test
          - admin.cr465.test
      socket: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

 # ------------------------------------------------------------------
  # PostgreSQL : instance unique, une base + un utilisateur par service
  # Jamais expose : reseau data uniquement, aucun port publie.
  # ------------------------------------------------------------------
  postgres:
    <<: *durcissement
    image: postgres:17.11-alpine
    container_name: cr465-postgres
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    cap_add:
      - CHOWN           # entrypoint : attribution du volume de donnees
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      DRUPAL_DB_PASSWORD: ${DRUPAL_DB_PASSWORD}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KC_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # ------------------------------------------------------------------
  # Keycloak : fournisseur d'identite et SSO (OIDC)
  # TLS termine par Traefik ; Keycloak recoit du HTTP sur le reseau app.
  # ------------------------------------------------------------------
  keycloak:
    <<: *durcissement
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: cr465-keycloak
    command: ["start", "--import-realm"]
    # Pas de read_only : au premier demarrage, Keycloak reconstruit sa
    # configuration Quarkus dans /opt/keycloak/lib (ecriture necessaire).
    # Ecart assume et documente dans docs/security/02-durcissement-execution.md.
    tmpfs:
      - /tmp
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${BASE_DOMAIN}
      KC_HTTP_ENABLED: "true"        # HTTP uniquement derriere Traefik
      KC_PROXY_HEADERS: xforwarded   # fait confiance aux X-Forwarded-* de Traefik
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      # l'image n'embarque pas curl : test HTTP minimal via /dev/tcp (bash)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${BASE_DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - traefik.docker.network=cr465_app

  # ------------------------------------------------------------------
  # socket-proxy-admin : API Docker en LECTURE + ECRITURE pour Portainer
  # (Portainer doit pouvoir creer/arreter des conteneurs).
  # Isole sur le reseau socket, jamais expose publiquement.
  # ------------------------------------------------------------------
  socket-proxy-admin:
    <<: *durcissement
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: cr465-socket-proxy-admin
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      CONTAINERS: 1
      SERVICES: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      EXEC: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1          # ecriture autorisee : reservee a l'administration
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ------------------------------------------------------------------
  # Portainer CE : exploitation graphique (obligatoire dans l'enonce)
  # Acces via Traefik uniquement, restreint aux reseaux d'administration.
  # ------------------------------------------------------------------
  portainer:
    <<: *durcissement
    image: portainer/portainer-ce:2.45.2
    container_name: cr465-portainer
    command:
      - -H
      - tcp://socket-proxy-admin:2375
    volumes:
      - portainer_data:/data
    networks:
      - app
      - socket
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`admin.${BASE_DOMAIN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.middlewares=admin-allowlist@docker
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      # middleware d'allowlist (IP autorisees pour les interfaces d'admin)
      - traefik.http.middlewares.admin-allowlist.ipallowlist.sourcerange=${ADMIN_ALLOWLIST}

  # ------------------------------------------------------------------
  # Moodle : LMS principal (contenus consommes apres attribution d'acces)
  # Installation automatisee au premier demarrage (image alpine-moodle).
  # ------------------------------------------------------------------
  moodle:
    <<: *durcissement
    image: erseco/alpine-moodle:v5.3.0
    container_name: cr465-moodle
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      SITE_URL: https://lms.${BASE_DOMAIN}
      MOODLE_SITENAME: "CR465-Formation"   # pas d'espace : l'image passe la valeur en argument CLI
      MOODLE_LANGUAGE: fr
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_EMAIL: admin@${BASE_DOMAIN}
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${MOODLE_DB_NAME}
      DB_USER: ${MOODLE_DB_USER}
      DB_PASS: ${MOODLE_DB_PASSWORD}
      SSLPROXY: "true"        # TLS termine par Traefik
      REVERSEPROXY: "false"
    volumes:
      - moodle_data:/var/www/moodledata
      - moodle_html:/var/www/html
      - ./traefik/certs/cr465-ca.crt:/certs/cr465-ca.crt:ro
      - ./moodle/php/99-cr465.ini:/etc/php84/conf.d/99-cr465.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
      - egress          # necessaire pendant l'installation (dependances Composer)
    healthcheck:
      # Moodle repond 303 (redirection vers la page de connexion) : on accepte 2xx et 3xx
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login/index.php | grep -qE '^(200|303)'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.moodle.rule=Host(`lms.${BASE_DOMAIN}`)
      - traefik.http.routers.moodle.entrypoints=websecure
      - traefik.http.routers.moodle.tls=true
      - traefik.http.services.moodle.loadbalancer.server.port=8080
      - traefik.docker.network=cr465_app

  # ------------------------------------------------------------------
  # n8n : orchestration (webhook Drupal -> API Moodle)
  # ------------------------------------------------------------------
  n8n:
    <<: *durcissement
    image: n8nio/n8n:1.123.85
    container_name: cr465-n8n
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:mode=1777   # n8n y ecrit son cache (mode permissif requis)
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: flow.${BASE_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://flow.${BASE_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Toronto
      # variables utilisees par le workflow
      # autorise les expressions {{ $env.X }} dans les noeuds : le jeton Moodle
      # n'est jamais ecrit dans le workflow (il vient du .env)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Moodle redirige HTTP -> HTTPS (wwwroot https) : on passe par le nom public
      # interne (alias DNS) et on fait confiance a l'AC du projet.
      NODE_EXTRA_CA_CERTS: /certs/cr465-ca.crt
      MOODLE_INTERNAL_URL: https://lms.${BASE_DOMAIN}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
      MOODLE_COURSE_ID: ${MOODLE_COURSE_ID:-2}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./traefik/certs/cr465-ca.crt:/certs/cr465-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
      - egress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`flow.${BASE_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.docker.network=cr465_app

  # ------------------------------------------------------------------
  # Drupal Commerce : portail de vente (catalogue + paiement simule)
  # ------------------------------------------------------------------
  drupal:
    <<: *durcissement
    build:
      context: ./drupal
      dockerfile: Dockerfile
    image: cr465/drupal:1.0.0     # derivee de drupal:10.6.19-php8.4-apache (+ bcmath, intl, drush)
    container_name: cr465-drupal
    cap_add:
      # Apache demarre en root puis bascule vers www-data ; l'installation
      # ecrit dans des repertoires appartenant a www-data.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    environment:
      # connexion base (utilisee par le script d installation)
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_NAME: ${DRUPAL_DB_NAME}
      DRUPAL_DB_USER: ${DRUPAL_DB_USER}
      DRUPAL_DB_PASSWORD: ${DRUPAL_DB_PASSWORD}
      DRUPAL_ADMIN_USER: ${DRUPAL_ADMIN_USER:-admin}
      DRUPAL_ADMIN_PASSWORD: ${DRUPAL_ADMIN_PASSWORD:-changeme}
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      # l'image officielle utilise /opt/drupal (docroot = web/)
      # modules et vendor sont bakes dans l'image ; settings.php et files persistent
      - drupal_settings:/opt/drupal/web/sites/default
      - drupal_files:/opt/drupal/web/sites/default/files
      - ./traefik/certs/cr465-ca.crt:/certs/cr465-ca.crt:ro
      - ./drupal/php/99-cr465.ini:/usr/local/etc/php/conf.d/99-cr465.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
      - egress
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.drupal.rule=Host(`shop.${BASE_DOMAIN}`)
      - traefik.http.routers.drupal.entrypoints=websecure
      - traefik.http.routers.drupal.tls=true
      - traefik.http.services.drupal.loadbalancer.server.port=80
      - traefik.docker.network=cr465_app

volumes:
  postgres_data:
  keycloak_data:
  portainer_data:
  moodle_data:
  moodle_html:
  n8n_data:
  drupal_settings:
  drupal_files:
