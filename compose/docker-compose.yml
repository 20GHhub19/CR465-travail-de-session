# ============================================================
# Stack CR465 - Phase 3 durcie : reseaux + Traefik + socket-proxy + test
# Segmentation : edge (expose) / app (internal) / data (internal) / socket (internal)
# Durcissement : images epinglees, cap_drop ALL, no-new-privileges,
#                read_only, limites CPU/RAM, healthcheck, logs bornes
# ============================================================

# --- Options de securite communes a tous les services ---------
x-durcissement: &durcissement
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  edge:            # seul reseau relie a l'exterieur (ports 80/443 publies)
  app:             # communication applicative (Traefik <-> services)
    internal: true # aucun acces Internet : les services ne peuvent pas sortir
  data:
    internal: true # reserve aux bases de donnees (phase 4+)
  socket:
    internal: true # Traefik <-> socket-proxy uniquement

services:
  # ------------------------------------------------------------------
  # socket-proxy : expose l'API Docker en LECTURE SEULE a Traefik.
  # Evite de monter /var/run/docker.sock en direct : le mode :ro sur un
  # socket Unix n'empeche PAS les ecritures via l'API HTTP.
  # ------------------------------------------------------------------
  socket-proxy:
    <<: *durcissement
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: cr465-socket-proxy
    read_only: true
    tmpfs:
      - /tmp          # l'entrypoint ecrit /tmp/haproxy.cfg
      - /run          # haproxy ecrit son pidfile /run/haproxy.pid
    environment:
      CONTAINERS: 1   # lecture des conteneurs (necessaire a Traefik)
      SERVICES: 1
      NETWORKS: 1
      EVENTS: 1
      VERSION: 1      # Traefik negocie la version de l'API via /version
      INFO: 1
      PING: 1
      POST: 0         # AUCUNE ecriture : creation/modification impossible
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ------------------------------------------------------------------
  # Traefik : unique point d'entree HTTP/HTTPS
  # ------------------------------------------------------------------
  traefik:
    <<: *durcissement
    image: traefik:v3.7.15          # version de correctif epinglee
    container_name: cr465-traefik
    user: "1000:1000"              # non-root (uid/gid de l'utilisateur admin)
    read_only: true
    tmpfs:
      - /tmp
    cap_add:
      - NET_BIND_SERVICE           # seule capacite conservee : ports < 1024
    environment:
      # Negociation explicite de l'API Docker : sinon le client demande 1.24,
      # refuse par les moteurs recents (minimum 1.40 depuis Docker 25+).
      DOCKER_API_VERSION: "1.44"
    command:
      # --- decouverte des conteneurs via le proxy filtre (pas le socket brut)
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      # --- points d'entree
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # --- redirection systematique HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # --- journalisation d'acces en JSON (exploitable plus tard par Loki)
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
      # --- endpoint de sante interne (non publie)
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
      - app
      - socket
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ------------------------------------------------------------------
  # whoami : service de TEST du routage (a retirer avant la remise finale)
  # ------------------------------------------------------------------
  whoami:
    <<: *durcissement
    image: traefik/whoami:v1.12.0   # version epinglee (plus de :latest)
    container_name: cr465-whoami
    user: "65534:65534"             # nobody
    read_only: true
    environment:
      WHOAMI_PORT_NUMBER: "8080"    # port non privilegie -> compatible non-root
    networks:
      - app                         # jamais expose directement : passe par Traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.cr465.test`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls=true
      - traefik.http.services.whoami.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M
    # Pas de healthcheck : l'image est "scratch" (aucun shell ni binaire HTTP
    # disponible a l'interieur). Le healthcheck de Traefik couvre le proxy ;
    # scripts/test-routing.sh couvre le routage vers whoami.

  # ------------------------------------------------------------------
  # PostgreSQL : instance unique, une base + un utilisateur par service
  # Jamais expose : reseau data uniquement, aucun port publie.
  # ------------------------------------------------------------------
  postgres:
    <<: *durcissement
    image: postgres:17.11-alpine
    container_name: cr465-postgres
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    cap_add:
      - CHOWN           # entrypoint : attribution du volume de donnees
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      DRUPAL_DB_PASSWORD: ${DRUPAL_DB_PASSWORD}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KC_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # ------------------------------------------------------------------
  # Keycloak : fournisseur d'identite et SSO (OIDC)
  # TLS termine par Traefik ; Keycloak recoit du HTTP sur le reseau app.
  # ------------------------------------------------------------------
  keycloak:
    <<: *durcissement
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: cr465-keycloak
    command: ["start", "--import-realm"]
    # Pas de read_only : au premier demarrage, Keycloak reconstruit sa
    # configuration Quarkus dans /opt/keycloak/lib (ecriture necessaire).
    # Ecart assume et documente dans docs/security/02-durcissement-execution.md.
    tmpfs:
      - /tmp
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${BASE_DOMAIN}
      KC_HTTP_ENABLED: "true"        # HTTP uniquement derriere Traefik
      KC_PROXY_HEADERS: xforwarded   # fait confiance aux X-Forwarded-* de Traefik
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      # l'image n'embarque pas curl : test HTTP minimal via /dev/tcp (bash)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${BASE_DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

volumes:
  postgres_data:
  keycloak_data:
