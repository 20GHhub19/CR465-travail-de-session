; Configuration PHP additionnelle pour Moodle (CR465)
; Moodle appelle Keycloak en HTTPS via Traefik, dont le certificat est signe
; par l'AC locale du projet (scripts/gen-certs.sh). On declare cette AC comme
; autorite de confiance pour cURL et OpenSSL.

curl.cainfo = /certs/cr465-ca.crt
openssl.cafile = /certs/cr465-ca.crt
